name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Prepare static website
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import shutil
          import subprocess

          root = pathlib.Path.cwd()
          output = root / "_site"
          output.mkdir()
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for item in filter(None, paths):
              source = pathlib.PurePosixPath(item)
              if source.parts[0] in {".github", "_site"}:
                  continue
              src = root.joinpath(*source.parts)
              dst = output.joinpath(*source.parts)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
